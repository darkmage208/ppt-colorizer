services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ppt_colorizer
      POSTGRES_USER: ppt_user
      POSTGRES_PASSWORD: ppt_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppt_user -d ppt_colorizer"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ppt_user:ppt_password@db:5432/ppt_colorizer
      - SECRET_KEY=your-secret-key-change-in-production
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - R2_ACCOUNT_ID=d9a167e5a9fea80d05f4c7fa765442e4
      - R2_ACCESS_KEY_ID=31719596b4783126cdf2114c4ba740f8
      - R2_SECRET_ACCESS_KEY=a0b8d4560d9d46c51f049e1d0c0f1f8c930ea06b1b38caacc02c9c2c6480d2bf
      - R2_BUCKET_NAME=ppt-colorizer
      - R2_PUBLIC_URL=https://d9a167e5a9fea80d05f4c7fa765442e4.r2.cloudflarestorage.com
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://ppt_user:ppt_password@db:5432/ppt_colorizer
      - SECRET_KEY=your-secret-key-change-in-production
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - R2_ACCOUNT_ID=d9a167e5a9fea80d05f4c7fa765442e4
      - R2_ACCESS_KEY_ID=31719596b4783126cdf2114c4ba740f8
      - R2_SECRET_ACCESS_KEY=a0b8d4560d9d46c51f049e1d0c0f1f8c930ea06b1b38caacc02c9c2c6480d2bf
      - R2_BUCKET_NAME=ppt-colorizer
      - R2_PUBLIC_URL=https://d9a167e5a9fea80d05f4c7fa765442e4.r2.cloudflarestorage.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: