services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppt_colorizer_local}
      POSTGRES_USER: ${POSTGRES_USER:-ppt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppt_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - app-network-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppt_user} -d ${POSTGRES_DB:-ppt_colorizer_local}"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data
    networks:
      - app-network-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ppt_user}:${POSTGRES_PASSWORD:-ppt_password}@db:5432/${POSTGRES_DB:-ppt_colorizer_local}
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-key-change-in-production}
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - DEBUG=true
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-local-dev}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-local-dev}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-local-dev}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-local-dev-bucket}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-http://localhost:8000/files}
      - CONVERTAPI_SECRET=${CONVERTAPI_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network-local
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - conversion_storage:/app/conversion_storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ppt_user}:${POSTGRES_PASSWORD:-ppt_password}@db:5432/${POSTGRES_DB:-ppt_colorizer_local}
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-key-change-in-production}
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379
      - CELERY_RESULT_BACKEND=redis://redis:6379
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-local-dev}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-local-dev}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-local-dev}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-local-dev-bucket}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-http://localhost:8000/files}
      - CONVERTAPI_SECRET=${CONVERTAPI_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network-local
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - conversion_storage:/app/conversion_storage
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=8 -Q ppt_processing,conversion_processing

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
      args:
        - VITE_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    networks:
      - app-network-local
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin123}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    networks:
      - app-network-local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_local_data:
  redis_local_data:
  pgadmin_data:
  conversion_storage:

networks:
  app-network-local:
    driver: bridge